[project]
name = "sages-mcp"
version = "0.1.0"
description = "MCP server for Sages: seven teacher portrayals (the Buddha, Laozi, Confucius, Marcus Aurelius, Epictetus, Carl Jung, Charlie Munger) with source-verified passages. No model calls, no API keys."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "NTP-996" }]
keywords = ["mcp", "agent-skills", "philosophy", "stoicism", "buddhism", "taoism", "confucius", "jung", "munger", "personas"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3,<3",
  "structlog>=24",
]

[project.urls]
Homepage = "https://github.com/NTP-996/sages"
Repository = "https://github.com/NTP-996/sages"
Issues = "https://github.com/NTP-996/sages/issues"

[project.scripts]
sages-mcp = "sages_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "anyio>=4",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sages_mcp"]

# The skills tree and the source texts are the only copy of the content. The wheel carries
# them as package data, so nothing is duplicated in git and there is nothing to sync.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "sages_mcp/_data/skills"
"sources" = "sages_mcp/_data/sources"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "sources", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["scripts", "scripts/sources", "."]
markers = [
  "network: fetches from the internet; deselected by default",
]

[tool.coverage.run]
source = ["src/sages_mcp"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["sources", "sources-local", "docs-private", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Source texts quote curly punctuation on purpose.
"tests/*" = ["RUF001"]
"scripts/*" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "scripts"]
mypy_path = ["src", "scripts", "scripts/sources"]
explicit_package_bases = true
